<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Todo App</title><meta name="description" content="A simple space to keep track of your daily tasks."><link rel="stylesheet" href="style.css"></head><body><main><h1>Todo App</h1><form><input id="task" aria-label="New task" placeholder="What needs doing?" autocomplete="off" maxlength="300"><button class="add">Add</button></form><div class="toolbar"><span class="tip">Tip: double-click a todo to edit. Press Enter to save.</span><nav class="filters" aria-label="Filter tasks"><button class="filter selected" data-filter="all">All</button><button class="filter" data-filter="active">Active</button><button class="filter" data-filter="completed">Completed</button></nav></div><ul aria-label="Tasks"></ul><footer><span id="count" aria-live="polite"></span><div><button class="clear" id="completed">Clear completed</button><button class="clear" id="clear">Clear all</button></div></footer></main><script src="script.js" defer></script></body></html>
